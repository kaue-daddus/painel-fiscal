<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daddus · Panorama Fiscal dos Municípios</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g-950:#0F0F12; --g-900:#141418; --g-850:#1A1A1F; --g-800:#212127; --g-700:#2B2B32; --g-600:#3A3A43;
  --line:#2E2E36; --line-soft:#26262C;
  --ink:#F2F2F4; --ink-2:#C9C9D0; --mute:#8E8E99;
  --red:#E23131; --vinho:#A90920; --red-soft:rgba(226,49,49,.14);
  --ok:#3BA776; --warn:#D9A62B; --bad:#E23131; --off:#4B4B55;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --disp:"Lexend","Nunito",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--g-950);color:var(--ink);font-family:var(--sans);font-size:13.5px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--g-600);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--disp);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}

#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--g-900);border-bottom:1px solid var(--line);position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--vinho),var(--red) 40%,transparent 70%)}
.logo{height:34px;display:block}
.brand{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);padding-left:14px;line-height:1.15}
.brand b{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.01em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:2px}
.spacer{flex:1}
.search{position:relative}
.search input{background:var(--g-950);border:1px solid var(--line);border-radius:7px;padding:8px 11px;width:260px;outline:none}
.search input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.ac{position:absolute;top:40px;left:0;right:0;background:var(--g-850);border:1px solid var(--line);border-radius:9px;max-height:330px;overflow:auto;z-index:40;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.ac div{padding:8px 11px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.ac div:hover,.ac div.on{background:var(--g-800)}
.btn{background:var(--g-800);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-weight:700;font-family:var(--disp);font-size:12px}
.btn:hover{border-color:var(--g-600);background:var(--g-700)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--vinho)}
.btn:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--red);outline-offset:1px}

main{display:grid;grid-template-columns:240px 1fr 370px;min-height:0}
.col{min-height:0;display:flex;flex-direction:column}
#side{border-right:1px solid var(--line);background:var(--g-900);overflow:auto}
#detail{border-left:1px solid var(--line);background:var(--g-900);overflow:auto}
#center{position:relative;background:radial-gradient(1100px 700px at 50% 42%,#1C1C22,#0F0F12 80%)}

.blk{padding:13px 14px;border-bottom:1px solid var(--line-soft)}
.blk h4{margin:0 0 10px;font-family:var(--disp);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:11px;color:var(--ink-2);margin-bottom:4px}
select,.inp{width:100%;background:var(--g-950);border:1px solid var(--line);border-radius:7px;padding:7px 9px;outline:none}
select:focus,.inp:focus{border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--g-950);border-radius:6px;padding:4px 8px;font-size:11.5px;font-family:var(--mono);display:flex;align-items:center;gap:6px;opacity:.4}
.chip.on{opacity:1;border-color:var(--g-600);background:var(--g-800)}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip u{text-decoration:none;color:var(--mute);font-size:10px}

.stat{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px dotted var(--line-soft)}
.stat:last-child{border:0}
.stat b{font-family:var(--mono);font-weight:600}
.stat span{color:var(--ink-2);font-size:12px}

#map{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
.mapctl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:5px;z-index:5}
.mapctl button{width:32px;height:32px;background:rgba(26,26,31,.92);border:1px solid var(--line);border-radius:7px;font-size:16px;line-height:1}
.mapctl button:hover{border-color:var(--red)}
.legend{position:absolute;left:12px;bottom:46px;background:rgba(20,20,24,.94);border:1px solid var(--line);border-radius:10px;padding:10px 12px;z-index:5;backdrop-filter:blur(6px);max-width:300px}
.legend .row{display:flex;align-items:center;gap:7px;padding:2.5px 0;font-size:11.5px}
.legend i{width:13px;height:13px;border-radius:3px;flex:none}
.legend .rmp{display:flex;height:9px;border-radius:3px;overflow:hidden;margin:5px 0 4px}
.legend .rmp i{flex:1;border-radius:0;height:9px;width:auto}
.legend .rmplab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--mute)}
#tip{position:absolute;pointer-events:none;z-index:30;background:rgba(15,15,18,.97);border:1px solid var(--g-600);border-radius:9px;padding:9px 11px;display:none;min-width:180px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
#tip b{display:block;font-size:13px;margin-bottom:3px;font-family:var(--disp);font-weight:600}
#tip .l{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;color:var(--ink-2)}
#tip .l b{display:inline;font-family:var(--mono);color:var(--ink);font-size:11.5px;margin:0}
.hint{position:absolute;left:12px;top:12px;z-index:4;font-size:11px;color:var(--mute);background:rgba(20,20,24,.85);border:1px solid var(--line-soft);border-radius:7px;padding:5px 9px}

.badge{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:40px;border-radius:9px;font-family:var(--mono);font-weight:700;font-size:19px;color:#0F0F12;padding:0 10px}
.ribbon{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 3px}
.rb{background:var(--g-850);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.rb .k{font-family:var(--disp);font-size:9px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;font-weight:600}
.rb .v{font-family:var(--mono);font-size:17px;font-weight:600;margin:3px 0 1px}
.rb .n{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#0F0F12;display:inline-block}
.rb .scale{position:relative;height:4px;background:var(--g-950);border-radius:2px;margin-top:7px;overflow:visible}
.rb .scale u{position:absolute;top:0;bottom:0;display:block;border-radius:2px}
.rb .mk{position:absolute;top:-3px;width:2px;height:10px;background:var(--ink);border-radius:1px;box-shadow:0 0 0 1px rgba(15,15,18,.9)}
.rb .lim{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;color:var(--mute);margin-top:4px}

.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;margin-top:9px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-family:var(--mono);text-align:right}
.note{font-size:11.5px;color:var(--mute);line-height:1.5;background:var(--g-850);border-left:2px solid var(--red);padding:8px 10px;border-radius:0 7px 7px 0;margin-top:9px;white-space:pre-line}

.cauc{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;font-size:11.5px;align-items:center;margin-top:8px}
.cauc .cd{font-family:var(--mono);color:var(--mute);font-size:10px}
.cauc .cn{color:var(--ink-2);line-height:1.3}
.cauc .cs{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;white-space:nowrap}

table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{position:sticky;top:0;background:var(--g-850);text-align:left;padding:7px 9px;font-family:var(--disp);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:2;font-weight:600}
table.t th:hover{color:var(--ink)}
table.t td{padding:5px 9px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.t td.n{font-family:var(--mono);text-align:right}
table.t tr:hover td{background:var(--g-850)}
table.t tr.sel td{background:var(--red-soft)}

#dock{position:absolute;left:0;right:0;bottom:0;background:var(--g-900);border-top:1px solid var(--line);z-index:6;transition:height .18s ease;height:36px;overflow:hidden;display:flex;flex-direction:column}
#dock.open{height:min(58%,440px)}
.tabs{display:flex;align-items:center;gap:2px;padding:0 8px;height:36px;flex:none;border-bottom:1px solid var(--line-soft)}
.tab{background:none;border:0;padding:8px 12px;color:var(--mute);font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.03em;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.dockbody{flex:1;overflow:auto;padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--g-850);border:1px solid var(--line-soft);border-radius:10px;padding:12px 13px}
.card h5{margin:0 0 8px;font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}

#modal{position:fixed;inset:0;background:rgba(5,5,7,.8);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.on{display:flex}
.mbox{background:var(--g-900);border:1px solid var(--line);border-radius:14px;max-width:660px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-family:var(--disp);font-size:15px;font-weight:600}
.mbody{padding:16px 18px}
.drop{border:1.5px dashed var(--g-600);border-radius:10px;padding:22px;text-align:center;color:var(--ink-2);background:var(--g-950)}
.drop.hot{border-color:var(--red);background:var(--red-soft)}
.src{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.src .st{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;flex:none;margin-top:1px}
.log{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--g-950);border:1px solid var(--line-soft);border-radius:8px;padding:9px;margin-top:12px;max-height:150px;overflow:auto;white-space:pre-wrap}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:var(--g-950);z-index:200}
#boot img{height:56px;opacity:.9}
#boot .b{width:200px;height:2px;background:var(--g-700);overflow:hidden;border-radius:2px}
#boot .b i{display:block;height:100%;width:35%;background:var(--red);animation:sl 1s infinite ease-in-out}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(390%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1180px){main{grid-template-columns:205px 1fr 310px}.search input{width:190px}}
@media (max-width:900px){
  body{overflow:auto}
  main{grid-template-columns:1fr;grid-auto-rows:min-content}
  #center{height:64vh;position:relative}
  #side,#detail{border:0;border-top:1px solid var(--line)}
  header{flex-wrap:wrap;gap:10px}
  .brand{display:none}
}
</style>

function unb64(s){const b=atob(s.trim());const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const TD=new TextDecoder();
function unpack(id){return JSON.parse(TD.decode(pako.ungzip(unb64(document.getElementById(id).textContent))));}
function topoFeature(topo,name){
  const o=topo.objects[name],A=topo.arcs,tr=topo.transform;
  const sx=tr?tr.scale[0]:1,sy=tr?tr.scale[1]:1,tx=tr?tr.translate[0]:0,ty=tr?tr.translate[1]:0;
  const cache=new Array(A.length);
  function arc(i){if(cache[i])return cache[i];const a=A[i],out=new Array(a.length);let x=0,y=0;
    for(let j=0;j<a.length;j++){if(tr){x+=a[j][0];y+=a[j][1];out[j]=[x*sx+tx,y*sy+ty];}else out[j]=[a[j][0],a[j][1]];}
    return cache[i]=out;}
  function ring(list){const line=[];
    for(let k=0;k<list.length;k++){let i=list[k],rev=false;if(i<0){i=~i;rev=true;}const p=arc(i);
      if(rev){for(let j=p.length-1-(k?1:0);j>=0;j--)line.push(p[j]);}else{for(let j=(k?1:0);j<p.length;j++)line.push(p[j]);}}
    return line;}
  const geom=g=>g.type==="Polygon"?{type:"Polygon",coordinates:g.arcs.map(ring)}:g.type==="MultiPolygon"?{type:"MultiPolygon",coordinates:g.arcs.map(p=>p.map(ring))}:null;
  return{type:"FeatureCollection",features:o.geometries.map(g=>({type:"Feature",properties:g.properties||{},geometry:geom(g)}))};
}

      const v=opBRL(o),yy=a.y[y]||(a.y[y]={aut:0,and:0,n:0,fx:0});yy.n++;a.n++;

const cv=$("#cv"),ctx=cv.getContext("2d");
const hc=document.createElement("canvas").getContext("2d");
let W=0,H=0,dpr=1,proj,T=d3.zoomIdentity,P2D=[],BB=[],UFP,ALLP,BINS=[],SELP=null,raf=null;
function buildPaths(){
  proj=d3.geoMercator().fitExtent([[12,12],[W-12,H-50]],UFGEO);
  const gp=d3.geoPath(proj);
  P2D=new Array(N);BB=new Array(N);ALLP=new Path2D();
  for(let i=0;i<N;i++){const s=gp(FEATS[i])||"";const p=new Path2D(s);P2D[i]=p;ALLP.addPath(p);
    const b=gp.bounds(FEATS[i]);BB[i]=[b[0][0],b[0][1],b[1][0],b[1][1]];}
  UFP=new Path2D(gp(UFGEO)||"");
}
function buildBins(){
  const map=new Map();
  for(let i=0;i<N;i++){const m=BYC[FEATS[i].properties.id];
    const c=!m?NADA:!VIS.has(m.c)?DIM:mcolor(m,S.metric);
    let p=map.get(c);if(!p){p=new Path2D();map.set(c,p);}p.addPath(P2D[i]);}
  BINS=[...map.entries()];
  const dim=BINS.findIndex(b=>b[0]===DIM);if(dim>0){const d=BINS.splice(dim,1)[0];BINS.unshift(d);}
}
function resize(){
  const r=$("#center").getBoundingClientRect();W=Math.max(200,r.width);H=Math.max(200,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;
  buildPaths();buildBins();draw();
}
function draw(){if(raf)return;raf=requestAnimationFrame(()=>{raf=null;paint();});}
function paint(){
  if(!proj)return;const k=T.k;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  ctx.setTransform(dpr*k,0,0,dpr*k,dpr*T.x,dpr*T.y);
  for(const [c,p] of BINS){ctx.fillStyle=c;ctx.fill(p,"evenodd");}
  if(k>2.2){ctx.lineWidth=.35/k;ctx.strokeStyle="rgba(15,15,18,.7)";ctx.stroke(ALLP);}
  ctx.lineWidth=Math.max(.6,1/k);ctx.strokeStyle="rgba(242,242,244,.38)";ctx.stroke(UFP);
  for(const c of S.cmp){const i=FIDX[c];if(i!=null&&c!==S.sel){ctx.lineWidth=1.6/k;ctx.strokeStyle="#F2F2F4";ctx.stroke(P2D[i]);}}
  if(S.sel&&FIDX[S.sel]!=null){const p=P2D[FIDX[S.sel]];
    ctx.lineWidth=3/k;ctx.strokeStyle="#0F0F12";ctx.stroke(p);ctx.lineWidth=1.8/k;ctx.strokeStyle="#E23131";ctx.stroke(p);}
}
function pick(x,y){
  const bx=(x-T.x)/T.k,by=(y-T.y)/T.k;
  for(let i=N-1;i>=0;i--){const b=BB[i];if(bx<b[0]||bx>b[2]||by<b[1]||by>b[3])continue;
    if(hc.isPointInPath(P2D[i],bx,by,"evenodd"))return FEATS[i];}
  return null;
}

let down=null;
cv.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY];});
cv.addEventListener("pointerup",e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5){down=null;return;}down=null;
  const r=cv.getBoundingClientRect(),f=pick(e.clientX-r.left,e.clientY-r.top);
  if(f&&BYC[f.properties.id])select(f.properties.id);

function zoomTo(code,isUf){
  let b;
  if(isUf){const idx=[];FEATS.forEach((f,i)=>{if(f.properties.uf===code)idx.push(i);});if(!idx.length)return;
    b=[Infinity,Infinity,-Infinity,-Infinity];idx.forEach(i=>{const q=BB[i];b=[Math.min(b[0],q[0]),Math.min(b[1],q[1]),Math.max(b[2],q[2]),Math.max(b[3],q[3])];});}
  else{const i=FIDX[code];if(i==null)return;b=BB[i];}
  const dx=b[2]-b[0],dy=b[3]-b[1],cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
  const k=Math.max(1,Math.min(120,.8/Math.max(dx/W,dy/(H-40))));
  d3.select(cv).transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(W/2,(H-40)/2).scale(k).translate(-cx,-cy));
}
